[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]

[project]
name = "cusmic"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
slim = []
cuda12 = ["cupy-cuda12x"]
cuda13 = ["cupy-cuda13x"]
cli  = ["astropy", "click"]
bench = ["numpy", "astropy", "click", "lacosmic==1.4.0"]
test = ["astropy", "click", "pytest>=8.2", "lacosmic==1.4.0"]
demo = ["astropy", "click", "matplotlib", "jupyterlab"]

[project.scripts]
cupysmic = "cusmic.__main__:main"

[tool.setuptools.packages.find]
where = ["mod"]

[tool.pytest.ini_options]
pythonpath = ["mod"]
testpaths = ["test"]
markers = [
    "e2e: compare the public API and CLI against the saved reference",
    "host: checks that need no CuPy, CUDA compiler, or GPU",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
