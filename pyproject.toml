[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]

[project]
name = "cusmic"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["cupy"]

[project.optional-dependencies]
slim = []
cli = ["click", "numpy", "astropy"]

[project.scripts]
cusmic = "cusmic.__main__:main"

[tool.setuptools.packages.find]
where = ["mod"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
