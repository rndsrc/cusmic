[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]

[project]
name = "cusmic"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["cupy"]

[project.optional-dependencies]
slim = []
cli  = ["numpy", "astropy", "click"]
test = ["numpy", "astropy", "click", "pytest>=8.2", "lacosmic==1.4.0"]
demo = ["numpy", "astropy", "click", "matplotlib", "jupyterlab"]

[project.scripts]
cusmic = "cusmic.__main__:main"

[tool.setuptools.packages.find]
where = ["mod"]

[tool.pytest.ini_options]
pythonpath = ["mod"]
testpaths = ["test"]
markers = ["e2e: compare the public API and CLI against the saved reference"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
